<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>만득이네 관리자</title>
<style>
  :root{
    --ink:#23312d; --sub:#6b7b76; --line:#dfe7e4;
    --mint:#2a9d8b; --mint-deep:#1f7d6e; --bg:#f4f8f6;
    --warn:#c2554a; --card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* hidden 을 켰는데 display 규칙이 이겨 버리면 안 숨는다. 이 한 줄이 그걸 막는다 */
  [hidden]{display:none !important}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;line-height:1.6;padding-bottom:110px;
  }
  header{
    background:var(--mint-deep);color:#fff;padding:14px 16px;
    position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.5px}
  header p{margin:2px 0 0;font-size:13px;opacity:.85}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  /* ── 탭 ── */
  .tabs{display:flex;gap:8px;margin:14px 0 4px}
  .tabs button{
    flex:1;padding:12px 8px;border:2px solid var(--line);background:#fff;
    border-radius:12px;font-size:16px;font-weight:800;color:var(--sub);
    font-family:inherit;cursor:pointer;
  }
  .tabs button.on{background:var(--mint);border-color:var(--mint);color:#fff}
  .panel{display:none;margin-top:12px}
  .panel.on{display:block}

  /* ── 사진 슬라이드 ── */
  .slide{
    display:flex;gap:12px;overflow-x:auto;padding:4px 0 14px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  }
  .slide::-webkit-scrollbar{height:6px}
  .slide::-webkit-scrollbar-thumb{background:#c6d4d0;border-radius:3px}
  .item{
    flex:none;width:230px;background:var(--card);border-radius:16px;
    padding:10px;box-shadow:0 2px 10px rgba(35,49,45,.1);scroll-snap-align:center;
  }
  .item .no{
    display:inline-block;background:var(--mint);color:#fff;font-weight:800;
    font-size:13px;padding:2px 10px;border-radius:20px;margin-bottom:8px;
  }
  .pair{display:flex;gap:6px}
  .half{flex:1;min-width:0}
  .ph{position:relative}
  .half img{
    width:100%;height:150px;object-fit:cover;border-radius:10px;display:block;
    background:#e8efec;
  }
  .half .tag{
    position:absolute;left:5px;bottom:5px;font-size:12px;font-weight:800;
    padding:3px 8px;border-radius:7px;background:#455651;color:#fff;
  }
  .half.aft .tag{background:var(--mint-deep)}
  .half button{
    display:block;width:100%;margin-top:6px;padding:8px 4px;font-size:13px;
    font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:9px;
    color:var(--ink);font-family:inherit;cursor:pointer;
  }
  .row{display:flex;gap:6px;margin-top:8px}
  .row button{
    flex:1;padding:10px 2px;font-size:14px;font-weight:800;border-radius:10px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;cursor:pointer;white-space:nowrap;letter-spacing:-.5px;
  }
  .row button.del{flex:0 0 46px;color:var(--warn);border-color:#f0cdc9}
  .row button:disabled{opacity:.35}
  .additem{
    flex:none;width:230px;border:2.5px dashed #bcccc7;border-radius:16px;
    background:transparent;color:var(--mint-deep);font-size:16px;font-weight:800;
    font-family:inherit;cursor:pointer;min-height:230px;
  }

  /* ── 문구 ── */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:800;color:var(--mint-deep);margin-bottom:5px}
  .field .hint{font-size:12.5px;color:var(--sub);margin:0 0 6px}
  .field textarea,.field input{
    width:100%;border:2px solid var(--line);border-radius:11px;padding:11px 12px;
    font-size:16px;font-family:inherit;line-height:1.6;color:var(--ink);background:#fff;
    resize:vertical;
  }
  .field textarea:focus,.field input:focus{outline:none;border-color:var(--mint)}

  /* ── 저장 막대 ── */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -3px 14px rgba(35,49,45,.1);
  }
  .bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .bar .st{flex:1;font-size:13.5px;color:var(--sub);min-width:0}
  .bar button{
    padding:13px 20px;border:0;border-radius:12px;font-size:16px;font-weight:800;
    font-family:inherit;cursor:pointer;background:var(--mint);color:#fff;white-space:nowrap;
  }
  .bar button.ghost{background:#eef3f1;color:var(--sub)}
  .bar button:disabled{opacity:.45}

  /* ── 열쇠 화면 ── */
  .gate{
    position:fixed;inset:0;z-index:60;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .gate .box{max-width:400px;width:100%;background:#fff;border-radius:18px;padding:22px;
    box-shadow:0 6px 24px rgba(35,49,45,.14)}
  .gate h2{margin:0 0 6px;font-size:19px}
  .gate p{margin:0 0 14px;font-size:14px;color:var(--sub)}
  .gate input{width:100%;border:2px solid var(--line);border-radius:11px;padding:12px;
    font-size:15px;font-family:inherit;margin-bottom:10px}
  .gate button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--mint);
    color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
  .gate .skip{background:#eef3f1;color:var(--sub);margin-top:8px}
  .err{color:var(--warn);font-size:14px;font-weight:700;margin:8px 0 0}

  /* ── 사진 고르기 ── */
  .sheet{
    position:fixed;inset:0;z-index:50;background:rgba(20,30,27,.55);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet .inner{
    background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;
  }
  .sheet h3{margin:0 0 4px;font-size:17px}
  .sheet .sub{margin:0 0 14px;font-size:13.5px;color:var(--sub)}
  .pickbtn{
    display:block;width:100%;padding:14px;border:2px solid var(--mint);border-radius:12px;
    background:var(--mint);color:#fff;font-size:16px;font-weight:800;font-family:inherit;
    cursor:pointer;margin-bottom:12px;
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid img{width:100%;height:92px;object-fit:cover;border-radius:10px;display:block;
    border:3px solid transparent;cursor:pointer;background:#e8efec}
  .closebtn{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;
    background:#eef3f1;color:var(--sub);font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
  .note{background:#fff8e8;border:1.5px solid #f0dfb8;border-radius:11px;padding:11px 13px;
    font-size:13.5px;color:#6b5a32;margin:12px 0}
  a.view{display:inline-block;margin-top:4px;font-size:14px;color:var(--mint-deep);font-weight:700}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">

    <!-- 평소: 비밀번호만 -->
    <div id="gLogin" hidden>
      <h2>🔐 만득이네 관리자</h2>
      <p>비밀번호를 넣어 주세요.</p>
      <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password"
             enterkeyhint="go">
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin-bottom:12px">
        <input type="checkbox" id="remember" checked style="width:18px;height:18px;margin:0">
        이 기기에서 다음부터 바로 들어가기
      </label>
      <button id="pwOk" type="button">들어가기</button>
      <button class="skip" id="gSkip" type="button">그냥 둘러보기</button>
    </div>

    <!-- 열쇠 넣기 (형 전용, 주소 뒤에 #key 를 붙이면 나온다) -->
    <div id="gSetup" hidden>
      <h2>🔑 열쇠 넣기</h2>
      <p>깃허브 열쇠를 비밀번호로 잠가 둡니다. 한 번만 하면 됩니다.</p>
      <input type="password" id="sTok" placeholder="깃허브 열쇠 붙여넣기 (github_pat_…)" autocomplete="off">
      <input type="password" id="sPw1" placeholder="비밀번호" autocomplete="new-password">
      <input type="password" id="sPw2" placeholder="비밀번호 다시 한 번" autocomplete="new-password">
      <button id="setupOk" type="button">잠그고 시작하기</button>
      <button class="skip" id="gSkip2" type="button">그냥 둘러보기</button>
    </div>

    <p class="err" id="gateErr" hidden></p>
    <p id="gBusy" style="margin:10px 0 0;font-size:14px;color:var(--sub)" hidden></p>
  </div>
</div>

<header>
  <div class="wrap">
    <h1>만득이네 관리자</h1>
    <p>사진과 문구를 바꾸면 홈페이지에 그대로 반영됩니다</p>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="tabPhoto" class="on" type="button">📷 사진</button>
    <button id="tabText" type="button">✍️ 문구</button>
  </div>

  <section class="panel on" id="panelPhoto">
    <p class="hint" style="font-size:13.5px;color:var(--sub);margin:0 0 4px">
      왼쪽부터 홈페이지에 나오는 순서입니다. 옆으로 밀어서 보세요.
    </p>
    <div class="slide" id="slide"></div>
    <div class="note">
      사진은 <b>미용 전 · 미용 후</b> 한 쌍입니다. 한 쪽만 바꿔도 됩니다.<br>
      폰에서 고른 사진은 자동으로 작게 줄여서 올라갑니다.
    </div>
  </section>

  <section class="panel" id="panelText"></section>

  <a class="view" href="./" target="_blank" rel="noopener">홈페이지 열어보기 →</a>
  <button type="button" id="logout"
    style="display:block;margin:18px 0 8px;padding:10px 16px;border:1.5px solid var(--line);
           background:#fff;border-radius:11px;font-size:14px;font-weight:700;color:var(--sub);
           font-family:inherit;cursor:pointer">나가기 (비밀번호 다시 묻게)</button>
</div>

<div class="bar">
  <div class="in">
    <span class="st" id="st">불러오는 중…</span>
    <button class="ghost" id="undo" type="button" disabled>되돌리기</button>
    <button id="save" type="button" disabled>저장하기</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="inner">
    <h3 id="sheetTitle">사진 고르기</h3>
    <p class="sub">폰에 있는 사진을 올리거나, 이미 쓰던 사진 중에서 고르세요.</p>
    <button class="pickbtn" id="pickFile" type="button">📱 폰에서 사진 고르기</button>
    <div class="grid" id="pickGrid"></div>
    <button class="closebtn" id="sheetClose" type="button">닫기</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
(function () {
  'use strict';

  var REPO = 'jesuslove26801-cmd/mandeuk-salon';
  var API = 'https://api.github.com/repos/' + REPO + '/contents/';
  var KEY = 'mandeuk_admin_token';
  var OPEN = 'mandeuk_admin_open';

  // 문구 항목 — 홈페이지 어디에 나오는지 사장님 말로 적는다
  var FIELDS = [
    { k: 'sub2',      t: '맨 위 한 줄',        h: '로고 아래 작은 글씨', big: 0 },
    { k: 'galTitle',  t: '사진 줄 제목',       h: '"미용 받은 아이들"',   big: 0 },
    { k: 'noteTitle', t: '미용 설명 제목',     h: '"1:1 예약제 · 맞춤 케어"', big: 0 },
    { k: 'noteBody',  t: '미용 설명 내용',     h: '한 줄 띄우면 문단이 나뉩니다', big: 1 },
    { k: 'priceN',    t: '금액 안내 — 첫 줄',  h: '', big: 1 },
    { k: 'priceD',    t: '금액 안내 — 둘째 줄', h: '', big: 1 },
    { k: 'priceNote', t: '금액 안내 — 강조 칸', h: '*별표 사이*는 굵게 나옵니다', big: 1 },
    { k: 'addr',      t: '주소',              h: '', big: 0 },
    { k: 'loc',       t: '위치',              h: '', big: 0 },
    { k: 'park',      t: '주차',              h: '', big: 0 },
    { k: 'hours',     t: '영업시간',          h: '', big: 0 },
    { k: 'off',       t: '휴무',              h: '', big: 0 }
  ];

  var token = '';
  var data = null;      // 지금 화면의 내용
  var original = '';    // 불러온 그대로 (되돌리기용)
  var sha = '';         // content.json 의 현재 판 번호
  var pending = {};     // 저장 때 올릴 새 사진 {경로: base64}
  var target = null;    // 지금 고르는 자리 {i, side}
  var poolCache = null;

  var $ = function (id) { return document.getElementById(id); };

  /* ───────── 비밀번호로 열기 ─────────
     열쇠는 비밀번호로 잠가 key.json 에 넣어 둔다.
     비밀번호는 어디에도 저장하지 않는다. 폰 안에서 열쇠를 푸는 데만 쓴다. */

  function showErr(m) { var e = $('gateErr'); e.textContent = m; e.hidden = !m; }
  function busy(m) { var e = $('gBusy'); e.textContent = m || ''; e.hidden = !m; }

  // 기억해 둔 열쇠가 있으면 비밀번호 없이 바로
  var wasOpen = false;
  try {
    token = sessionStorage.getItem(KEY) || localStorage.getItem(KEY) || '';
    wasOpen = !!(sessionStorage.getItem(OPEN) || localStorage.getItem(OPEN));
  } catch (e) { token = ''; }

  var vault = null;
  var unlocked = false;   // 비밀번호를 맞췄는가
  var wantKey = location.hash === '#key';   // 형이 열쇠를 넣으러 왔는가

  fetch('key.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (k) {
      vault = k;
      if (wantKey) { $('gSetup').hidden = false; return; }
      if (!k || !k.check) { $('gSetup').hidden = false; return; }   // 아직 비번이 없다
      if (wasOpen) { unlocked = true; $('gate').hidden = true; load(); return; }
      $('gLogin').hidden = false;
      $('pw').focus();
    });

  $('pwOk').addEventListener('click', unlock);
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });

  function unlock() {
    var pw = $('pw').value;
    if (!pw) { showErr('비밀번호를 넣어 주세요.'); return; }
    showErr(''); busy('여는 중…');
    $('pwOk').disabled = true;

    verify(vault, pw)
      .then(function (ok) {
        if (!ok) throw new Error('bad');
        // 열쇠가 들어 있으면 같이 풀어 둔다 (없으면 보기·고치기만 된다)
        if (vault.data && vault.iv) {
          return decrypt(vault, pw).then(function (t) { return t; }, function () { return ''; });
        }
        return '';
      })
      .then(function (t) {
        unlocked = true;
        token = t || '';
        try {
          var store = $('remember').checked ? localStorage : sessionStorage;
          store.setItem(OPEN, '1');
          if (token) store.setItem(KEY, token);
        } catch (e) {}
        busy(''); $('gate').hidden = true;
        load();
      })
      .catch(function () {
        busy(''); showErr('비밀번호가 맞지 않습니다.');
        $('pwOk').disabled = false;
        $('pw').value = ''; $('pw').focus();
      });
  }

  $('setupOk').addEventListener('click', function () {
    var tk = $('sTok').value.trim(), p1 = $('sPw1').value, p2 = $('sPw2').value;
    if (!tk) { showErr('깃허브 열쇠를 넣어 주세요.'); return; }
    if (p1.length < 4) { showErr('비밀번호는 4자 이상으로 정해 주세요.'); return; }
    if (p1 !== p2) { showErr('비밀번호 두 칸이 서로 다릅니다.'); return; }
    showErr(''); busy('열쇠를 확인하는 중…');
    $('setupOk').disabled = true;

    fetch(API + 'content.json', { headers: { Authorization: 'Bearer ' + tk } })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('열쇠가 맞지 않거나 권한이 모자랍니다.');
        if (!r.ok) throw new Error('깃허브에 연결하지 못했습니다.');
        busy('비밀번호로 잠그는 중…');
        return encrypt(tk, p1).then(function (k) {
          return rawKey(p1, b642ab(k.salt), k.iter)
            .then(function (bits) { return crypto.subtle.digest('SHA-256', bits); })
            .then(function (h) { k.check = ab2b64(new Uint8Array(h)); return k; });
        });
      })
      .then(function (k) {
        busy('저장하는 중…');
        token = tk;
        // 이미 key.json 이 있으면 판 번호를 받아서 덮어쓴다
        return fetch(API + 'key.json?t=' + Date.now(), {
          headers: { Authorization: 'Bearer ' + tk }, cache: 'no-store'
        }).then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (cur) {
            return put('key.json', textToB64(JSON.stringify(k, null, 2)),
                       cur && cur.sha, '관리자 비밀번호 설정');
          });
      })
      .then(function () {
        try { localStorage.setItem(KEY, tk); } catch (e) {}
        busy(''); $('gate').hidden = true;
        load();
        say('✅ 비밀번호를 정했습니다 — 다음부터는 비밀번호만 넣으면 됩니다');
      })
      .catch(function (e) {
        busy(''); showErr(e.message || '설정하지 못했습니다.');
        $('setupOk').disabled = false;
      });
  });

  $('logout').addEventListener('click', function () {
    if (Object.keys(pending).length && !confirm('저장하지 않은 사진이 있습니다. 그래도 나갈까요?')) return;
    try {
      [localStorage, sessionStorage].forEach(function (s) {
        s.removeItem(KEY); s.removeItem(OPEN);
      });
    } catch (e) {}
    location.replace(location.pathname);
  });

  $('gSkip').addEventListener('click', browse);
  $('gSkip2').addEventListener('click', browse);
  function browse() { $('gate').hidden = true; load(); }

  /* ── 잠그기·풀기 (브라우저 내장 암호 기능) ── */
  var ITER = 310000;
  function keyFrom(pw, salt) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }
  // 비밀번호가 맞는지만 본다 (열쇠가 없어도 쓸 수 있게)
  function verify(k, pw) {
    if (!k || !k.check) return Promise.resolve(false);
    return rawKey(pw, b642ab(k.salt), k.iter || ITER)
      .then(function (bits) { return crypto.subtle.digest('SHA-256', bits); })
      .then(function (h) { return ab2b64(new Uint8Array(h)) === k.check; });
  }
  function rawKey(pw, salt, iters) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: salt, iterations: iters, hash: 'SHA-256' }, base, 256);
      });
  }
  function encrypt(text, pw) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return keyFrom(pw, salt).then(function (k) {
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(text));
    }).then(function (buf) {
      return { v: 1, iter: ITER, salt: ab2b64(salt), iv: ab2b64(iv), data: ab2b64(new Uint8Array(buf)) };
    });
  }
  function decrypt(k, pw) {
    var salt = b642ab(k.salt), iv = b642ab(k.iv), data = b642ab(k.data);
    var iters = k.iter || ITER;
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: iters, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function ab2b64(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s);
  }
  function b642ab(b64) {
    var bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }

  /* ───────── 탭 ───────── */
  $('tabPhoto').addEventListener('click', function () { tab(true); });
  $('tabText').addEventListener('click', function () { tab(false); });
  function tab(photo) {
    $('tabPhoto').classList.toggle('on', photo);
    $('tabText').classList.toggle('on', !photo);
    $('panelPhoto').classList.toggle('on', photo);
    $('panelText').classList.toggle('on', !photo);
  }

  /* ───────── 불러오기 ───────── */
  // 내용은 같은 폴더의 content.json 에서 바로 읽는다. 깃허브 API 는 저장할 때만 쓴다.
  function load() {
    fetch('content.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('내용을 불러오지 못했습니다');
        return r.json();
      })
      .then(function (j) {
        data = j;
        if (!data.text) data.text = {};
        if (!data.gallery) data.gallery = [];
        original = JSON.stringify(data);
        buildText();
        render();
        say(token ? '불러왔습니다'
                  : (unlocked ? '불러왔습니다 — 저장은 아직 준비 중입니다' : '둘러보기'));
      })
      .catch(function (e) { say('⚠ ' + e.message); });
  }

  // 저장 직전에 현재 판 번호를 새로 받아 온다 (다른 기기에서 먼저 고쳤어도 안 깨지게)
  function freshSha() {
    return fetch(API + 'content.json?t=' + Date.now(), {
      headers: { Authorization: 'Bearer ' + token }, cache: 'no-store'
    }).then(function (r) {
      if (!r.ok) throw new Error('깃허브에 연결하지 못했습니다');
      return r.json();
    }).then(function (j) { sha = j.sha; return j.sha; });
  }

  /* ───────── 그리기 ───────── */
  function render() {
    var s = $('slide');
    s.innerHTML = '';
    data.gallery.forEach(function (p, i) {
      s.appendChild(itemEl(p, i));
    });
    var add = document.createElement('button');
    add.className = 'additem';
    add.type = 'button';
    add.textContent = '＋ 새 아이 추가';
    add.addEventListener('click', function () {
      var last = data.gallery[data.gallery.length - 1] || { before: '', after: '' };
      data.gallery.push({ before: last.before, after: last.after });
      render(); dirty();
      s.scrollLeft = s.scrollWidth;
      say('칸을 하나 늘렸습니다 — 바꾸기를 눌러 새 사진을 고르세요');
    });
    s.appendChild(add);
  }

  function itemEl(p, i) {
    var d = document.createElement('div');
    d.className = 'item';
    d.innerHTML =
      '<span class="no">' + (i + 1) + '번째</span>' +
      '<div class="pair">' +
        half('before', p.before, i) +
        half('after', p.after, i) +
      '</div>' +
      '<div class="row">' +
        '<button type="button" data-a="left"' + (i === 0 ? ' disabled' : '') + '>◀ 앞으로</button>' +
        '<button type="button" data-a="right"' + (i === data.gallery.length - 1 ? ' disabled' : '') + '>뒤로 ▶</button>' +
        '<button type="button" class="del" data-a="del"' + (data.gallery.length < 2 ? ' disabled' : '') + '>🗑</button>' +
      '</div>';

    d.querySelectorAll('[data-a]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-a');
        if (a === 'left') swap(i, i - 1);
        else if (a === 'right') swap(i, i + 1);
        else if (a === 'del') {
          if (!confirm((i + 1) + '번째 사진을 지울까요?')) return;
          data.gallery.splice(i, 1); render(); dirty();
        }
      });
    });
    d.querySelectorAll('[data-side]').forEach(function (b) {
      b.addEventListener('click', function () {
        target = { i: i, side: b.getAttribute('data-side') };
        openSheet();
      });
    });
    return d;
  }

  function half(side, src, i) {
    var ko = side === 'before' ? '미용 전' : '미용 후';
    return '<div class="half' + (side === 'after' ? ' aft' : '') + '">' +
      '<div class="ph"><img src="' + esc(src) + '" alt="">' +
      '<span class="tag">' + ko + '</span></div>' +
      '<button type="button" data-side="' + side + '">바꾸기</button>' +
      '</div>';
  }

  function swap(a, b) {
    var t = data.gallery[a];
    data.gallery[a] = data.gallery[b];
    data.gallery[b] = t;
    render(); dirty();
    // 옮긴 칸이 보이게 따라간다
    var s = $('slide'), el = s.children[b];
    if (el) s.scrollTo({ left: el.offsetLeft - 20, behavior: 'smooth' });
  }

  function buildText() {
    var p = $('panelText');
    p.innerHTML = '';
    FIELDS.forEach(function (f) {
      var w = document.createElement('div');
      w.className = 'field';
      var id = 'f_' + f.k;
      w.innerHTML = '<label for="' + id + '">' + f.t + '</label>' +
        (f.h ? '<p class="hint">' + f.h + '</p>' : '') +
        (f.big
          ? '<textarea id="' + id + '" rows="3"></textarea>'
          : '<input id="' + id + '" type="text">');
      p.appendChild(w);
      var el = w.querySelector('#' + id);
      el.value = (data.text && data.text[f.k]) || '';
      el.addEventListener('input', function () {
        data.text[f.k] = el.value;
        dirty();
      });
    });
  }

  /* ───────── 사진 고르기 ───────── */
  function openSheet() {
    $('sheetTitle').textContent =
      (target.side === 'before' ? '미용 전' : '미용 후') + ' 사진 고르기 — ' + (target.i + 1) + '번째';
    $('sheet').hidden = false;
    pool().then(function (list) {
      var g = $('pickGrid');
      g.innerHTML = '';
      list.forEach(function (src) {
        var im = document.createElement('img');
        im.src = src; im.alt = ''; im.loading = 'lazy';
        im.addEventListener('click', function () {
          data.gallery[target.i][target.side] = src;
          closeSheet(); render(); dirty();
        });
        g.appendChild(im);
      });
    });
  }
  function closeSheet() { $('sheet').hidden = true; }
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });

  // 이미 올려둔 사진 목록 — photos/w 와 photos/up 을 읽는다
  function pool() {
    if (poolCache) return Promise.resolve(poolCache);
    var h = token ? { Authorization: 'Bearer ' + token } : {};
    function dir(path) {
      return fetch(API + path, { headers: h })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (j) {
          return (Array.isArray(j) ? j : [])
            .filter(function (f) { return /\.(webp|jpg|jpeg|png)$/i.test(f.name); })
            .map(function (f) { return path + '/' + f.name; });
        })
        .catch(function () { return []; });
    }
    return Promise.all([dir('photos/w'), dir('photos/up')]).then(function (r) {
      var all = r[0].concat(r[1]).filter(function (p) { return !/brand|logo/i.test(p); });
      // 깃허브를 못 읽었으면 적어도 지금 쓰고 있는 사진은 고를 수 있게
      if (!all.length) {
        data.gallery.forEach(function (p) {
          [p._b || p.before, p._a || p.after].forEach(function (s) {
            if (s && s.indexOf('data:') !== 0 && all.indexOf(s) < 0) all.push(s);
          });
        });
      }
      Object.keys(pending).forEach(function (p) { if (all.indexOf(p) < 0) all.push(p); });
      poolCache = all;
      return all;
    });
  }

  /* ───────── 폰에서 사진 올리기 ───────── */
  $('pickFile').addEventListener('click', function () { $('file').click(); });

  $('file').addEventListener('change', function () {
    var f = $('file').files && $('file').files[0];
    $('file').value = '';
    if (!f || !target) return;
    say('사진을 줄이는 중…');
    shrink(f).then(function (r) {
      var name = 'photos/up/' + stamp() + '.' + r.ext;
      pending[name] = r.b64;
      if (poolCache && poolCache.indexOf(name) < 0) poolCache.push(name);
      data.gallery[target.i][target.side] = r.url;   // 미리보기는 폰 안의 그림으로
      // 저장할 때는 올라갈 경로를 쓴다
      data.gallery[target.i][target.side === 'before' ? '_b' : '_a'] = name;
      closeSheet(); render(); dirty();
      say('사진을 준비했습니다 — 저장하기를 누르세요');
    }).catch(function () { say('⚠ 사진을 읽지 못했습니다'); });
  });

  // 긴 쪽 560px 로 줄이고 webp 로 바꾼다 (안 되면 jpeg)
  function shrink(file) {
    return new Promise(function (ok, no) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var MAXW = 560, MAXH = 760;
        var s = Math.min(MAXW / img.width, MAXH / img.height, 1);
        var w = Math.round(img.width * s), h = Math.round(img.height * s);
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        var type = 'image/webp';
        var out = cv.toDataURL(type, 0.82);
        if (out.indexOf('data:image/webp') !== 0) { type = 'image/jpeg'; out = cv.toDataURL(type, 0.85); }
        URL.revokeObjectURL(url);
        ok({
          b64: out.split(',')[1],
          ext: type === 'image/webp' ? 'webp' : 'jpg',
          url: out
        });
      };
      img.onerror = function () { URL.revokeObjectURL(url); no(); };
      img.src = url;
    });
  }

  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
           p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  /* ───────── 저장 ───────── */
  $('save').addEventListener('click', save);
  $('undo').addEventListener('click', function () {
    if (!confirm('고친 내용을 모두 버리고 처음으로 되돌릴까요?')) return;
    data = JSON.parse(original);
    pending = {};
    buildText(); render();
    dirty();
    say('되돌렸습니다');
  });

  function save() {
    if (!token) { alert('저장하려면 열쇠가 필요합니다.'); return; }
    $('save').disabled = true;
    $('undo').disabled = true;

    // 미리보기용 data: 주소를 진짜 경로로 바꾼다
    var out = JSON.parse(JSON.stringify(data));
    out.gallery = out.gallery.map(function (p) {
      var q = { before: p._b || p.before, after: p._a || p.after };
      return q;
    });
    out.updated = new Date().toISOString().slice(0, 10);

    var files = Object.keys(pending);
    say(files.length ? '사진 ' + files.length + '장 올리는 중…' : '저장하는 중…');

    // 사진 먼저 한 장씩, 그 다음 content.json
    files.reduce(function (chain, path, n) {
      return chain.then(function () {
        say('사진 올리는 중… (' + (n + 1) + '/' + files.length + ')');
        return put(path, pending[path], null, '사진 추가 ' + path);
      });
    }, Promise.resolve())
      .then(freshSha)
      .then(function (s) {
        return put('content.json', textToB64(JSON.stringify(out, null, 2)), s, '사장님이 내용 수정');
      })
      .then(function (j) {
        sha = j.content.sha;
        pending = {};
        data = out;
        original = JSON.stringify(data);
        buildText(); render();
        say('✅ 저장했습니다 — 1~2분 뒤 홈페이지에 보여요');
        $('save').disabled = true;
        $('undo').disabled = true;
      })
      .catch(function (e) {
        say('⚠ ' + (e.message || '저장하지 못했습니다'));
        $('save').disabled = false;
        $('undo').disabled = false;
      });
  }

  function put(path, b64, shaVal, msg) {
    var body = { message: msg, content: b64 };
    if (shaVal) body.sha = shaVal;
    return fetch(API + path, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 409) throw new Error('다른 곳에서 먼저 고쳤습니다. 새로고침 뒤 다시 해 주세요.');
      if (r.status === 401 || r.status === 403) throw new Error('열쇠가 만료됐습니다. 새 열쇠가 필요합니다.');
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.message || '저장 실패'); });
      return r.json();
    });
  }

  /* ───────── 거들기 ───────── */
  function dirty() {
    var changed = JSON.stringify(stripPreview(data)) !== JSON.stringify(stripPreview(JSON.parse(original)));
    var has = changed || Object.keys(pending).length > 0;
    $('save').disabled = !has || !token;
    $('undo').disabled = !has;
    if (has) say(token ? '고친 내용이 있습니다 — 저장하기를 누르세요'
                       : '지금은 미리보기만 됩니다 (저장 준비 중)');
  }
  function stripPreview(o) {
    var c = JSON.parse(JSON.stringify(o));
    c.gallery = (c.gallery || []).map(function (p) {
      return { before: p._b || p.before, after: p._a || p.after };
    });
    delete c.updated;
    return c;
  }
  function say(m) { $('st').textContent = m; }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function textToB64(s) {
    var arr = new TextEncoder().encode(s), bin = '';
    for (var i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
    return btoa(bin);
  }

})();
</script>
</body>
</html>
